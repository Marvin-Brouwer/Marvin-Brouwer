# Reusable: feeds dependabot PRs through main one at a time, oldest first.
#
# The ruleset wants PRs up to date with main, but dependabot only rebases on
# conflicts, so after every merge the rest sit behind. Updating them all at
# once would just have each merge put the others behind again. Instead, while
# an up-to-date dependabot PR is still being checked this waits for it, and
# otherwise updates the oldest PR that is behind. That PR auto-merges, the push
# to main runs this again, and the next one follows.
#
# It updates through the update-branch API (a merge of main into the PR), not
# "@dependabot rebase": dependabot ignores commands from bots, and this runs as
# the automation GitHub App. The catch is that dependabot treats a PR updated
# that way as edited and stops maintaining it. If such a PR fails, comment
# "@dependabot recreate" on it to hand it back.
#
# A PR whose checks failed does not hold the line up; it is retried whenever it
# is the oldest one behind again, so a fix landing on main is picked up.
#
# Caller:
#
#   on:
#     push:
#       branches: ["main"]
#     # Picks the line back up after a PR fails or is closed, which does not push.
#     schedule:
#       - cron: "0 * * * *"
#     workflow_dispatch:
#   jobs:
#     dependabot:
#       uses: Marvin-Brouwer/Marvin-Brouwer/.github/workflows/dependabot-rebase.yml@v1
#       with:
#         app-id: ${{ vars.AUTOMATION_APP_ID }}
#       secrets: inherit
#
# These runs are not dependabot's, so AUTOMATION_APP_PRIVATE_KEY also has to be
# an Actions secret in the calling repo.
name: Dependabot rebase

on:
  workflow_call:
    inputs:
      app-id:
        description: ID of the automation GitHub App.
        type: string
        required: true
      base:
        description: Branch the dependabot PRs target.
        type: string
        default: main
    secrets:
      AUTOMATION_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: dependabot-rebase

jobs:
  rebase:
    name: Update the oldest dependabot PR
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Update the next PR
        uses: actions/github-script@v9
        env:
          BASE: ${{ inputs.base }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo
            const base = process.env.BASE

            const pulls = (await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base,
            }))
              .filter(pull => pull.user.login === 'dependabot[bot]')
              .toSorted((a, b) => a.created_at.localeCompare(b.created_at))

            const behind = []
            for (const pull of pulls) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${pull.head.sha}`,
              })
              if (comparison.behind_by > 0) {
                behind.push(pull)
                continue
              }

              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: pull.head.sha,
              })
              // No runs yet means the branch was only just pushed.
              const inFlight = checkRuns.length === 0
                || checkRuns.some(run => run.status !== 'completed')
              if (inFlight) {
                core.info(`#${pull.number} is up to date and still being checked, waiting on it.`)
                return
              }
            }

            const [next] = behind
            if (!next) {
              core.info('No dependabot PR is behind main.')
              return
            }

            core.info(`Updating #${next.number} with ${base}.`)
            await github.rest.pulls.updateBranch({
              owner,
              repo,
              pull_number: next.number,
              expected_head_sha: next.head.sha,
            })
