# Reusable: approves a dependabot PR and queues it for auto-merge.
#
# Patch and minor bumps are always approved. Majors are approved only when the
# matching flag is on: auto-approve-actions-major for github-actions, and
# auto-approve-major for every other ecosystem. A major that isn't approved
# still gets auto-merge queued, so it lands by itself once you approve it.
# That relies on the ruleset requiring an approving review.
#
# OpenTofu/Terraform bumps (module refs and providers) are never approved,
# whatever the flags say: merging one runs apply, which changes the repo's
# settings, so you get to read the plan first.
#
# Runs as the automation GitHub App, not as GITHUB_TOKEN: a merge performed as
# GITHUB_TOKEN does not trigger the push workflows on main, so nothing would
# deploy, and it cannot land github-actions bumps, since those touch
# .github/workflows.
#
# Caller (identical in every repo, the flags come from repo variables):
#
#   on: pull_request
#   jobs:
#     dependabot:
#       uses: Marvin-Brouwer/Marvin-Brouwer/.github/workflows/dependabot-auto-merge.yml@v1
#       with:
#         app-id: ${{ vars.AUTOMATION_APP_ID }}
#         auto-approve-major: ${{ vars.DEPENDABOT_AUTO_APPROVE_MAJOR == 'true' }}
#         auto-approve-actions-major: ${{ vars.DEPENDABOT_AUTO_APPROVE_ACTIONS_MAJOR != 'false' }}
#       secrets: inherit
#
# Dependabot-triggered runs only see Dependabot secrets, so
# AUTOMATION_APP_PRIVATE_KEY has to be a Dependabot secret in the calling repo.
name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      app-id:
        description: ID of the automation GitHub App.
        type: string
        required: true
      auto-approve-major:
        description: Approve semver-major bumps outside github-actions.
        type: boolean
        default: false
      auto-approve-actions-major:
        description: Approve semver-major bumps of github-actions.
        type: boolean
        default: true
      merge-method:
        description: squash, merge or rebase.
        type: string
        default: squash
    secrets:
      AUTOMATION_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    name: Auto-approve and merge
    runs-on: ubuntu-latest
    # Keyed on the PR's author rather than github.actor, so it still runs when
    # someone else pushes to the branch, e.g. the rebase queue's update-branch.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The rebase queue merges main into the branch, which adds a commit
          # that isn't dependabot's. The PR author check above still holds.
          skip-commit-verification: true

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ALLOW_MAJOR: ${{ inputs.auto-approve-major }}
          ALLOW_ACTIONS_MAJOR: ${{ inputs.auto-approve-actions-major }}
        run: |
          approve=true
          if [ "$ECOSYSTEM" = "terraform" ] || [ "$ECOSYSTEM" = "opentofu" ]; then
            echo "$ECOSYSTEM bump, merging it runs apply, waiting for a human approval."
            approve=false
          elif [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            if [ "$ECOSYSTEM" = "github_actions" ] || [ "$ECOSYSTEM" = "github-actions" ]; then
              allow="$ALLOW_ACTIONS_MAJOR"
            else
              allow="$ALLOW_MAJOR"
            fi
            if [ "$allow" != "true" ]; then
              echo "Major bump of $ECOSYSTEM and auto-approve is off for it, waiting for a human approval."
              approve=false
            fi
          fi
          echo "approve=$approve" >> "$GITHUB_OUTPUT"

      - name: Auto-approve
        if: steps.decide.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"
